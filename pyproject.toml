[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sealverify"
version = "0.4.0"
description = "Electronic seal and signature verification for OFD documents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["asn1crypto==1.5.1", "defusedxml==0.7.1"]

[project.scripts]
sealverify = "sealverify.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["sealverify*"]
namespaces = false

[tool.setuptools.package-data]
sealverify = ["web/*", "web/vendor/*", "web/fonts/*"]
